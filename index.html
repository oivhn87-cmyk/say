<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>太鼓の達人風 - フルコンボの宴</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      background: #222;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #score-board {
      height: 60px;
      line-height: 60px;
      font-size: 22px;
      font-weight: bold;
      background: #333;
    }
    #lane {
      position: relative;
      height: 120px;
      background: #444;
      border-top: 4px solid #666;
      border-bottom: 4px solid #666;
      overflow: hidden;
    }
    #target {
      position: absolute;
      left: 60px;
      top: 10px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 6px dashed #fff;
      box-sizing: border-box;
    }
    .note {
      position: absolute;
      top: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid #fff;
      box-sizing: border-box;
    }
    .note.don { background: #ff4757; }
    .note.ka { background: #1e90ff; }
    #judgment {
      height: 40px;
      line-height: 40px;
      font-size: 28px;
      font-weight: bold;
      color: #ffda79;
    }
    #controls {
      flex: 1;
      display: flex;
      padding: 10px;
      gap: 10px;
    }
    .btn {
      flex: 1;
      border-radius: 20px;
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 0 rgba(0,0,0,0.3);
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
    }
    #btn-ka, #btn-ka2 { background: #1e90ff; }
    #btn-don { background: #ff4757; }
    #start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #start-btn {
      padding: 15px 40px;
      font-size: 28px;
      font-weight: bold;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #b32b37;
    }
    #start-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b32b37;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="start-overlay">
      <h1 style="color: #ffda79; margin-bottom: 20px;">フルコンボの宴</h1>
      <button id="start-btn">スタート！</button>
    </div>

    <div id="score-board">SCORE: <span id="score">0</span> | COMBO: <span id="combo">0</span></div>
    
    <div id="lane">
      <div id="target"></div>
    </div>
    
    <div id="judgment"></div>

    <div id="controls">
      <div class="btn" id="btn-ka">カッ</div>
      <div class="btn" id="btn-don">ドン</div>
      <div class="btn" id="btn-ka2">カッ</div>
    </div>
  </div>

  <script>
    // 『フルコンボの宴』のサビ周りをイメージした譜面データ（秒数, タイプ）
    const chart = [
      { time: 1.0, type: 'don' }, { time: 1.5, type: 'don' }, { time: 2.0, type: 'ka' },
      { time: 2.8, type: 'don' }, { time: 3.3, type: 'don' }, { time: 3.8, type: 'ka' },
      { time: 4.5, type: 'don' }, { time: 4.8, type: 'don' }, { time: 5.1, type: 'don' }, { time: 5.4, type: 'ka' },
      { time: 6.2, type: 'don' }, { time: 6.5, type: 'don' }, { time: 7.0, type: 'ka' },
      { time: 8.0, type: 'don' }, { time: 8.5, type: 'ka' }, { time: 9.0, type: 'don' },
      { time: 9.8, type: 'don' }, { time: 10.1, type: 'don' }, { time: 10.4, type: 'ka' }, { time: 10.7, type: 'ka' },
      { time: 11.5, type: 'don' }, { time: 12.0, type: 'don' }, { time: 12.5, type: 'don' }, { time: 13.0, type: 'ka' },
      { time: 14.0, type: 'don' }, { time: 14.3, type: 'don' }, { time: 14.6, type: 'don' }, { time: 15.0, type: 'ka' }
    ];

    const lane = document.getElementById('lane');
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const judgmentEl = document.getElementById('judgment');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let combo = 0;
    let startTime = 0;
    let isPlaying = false;
    const targetX = 60 + 50; // 判定位置 (110px)
    const noteSpeed = 400; // ノーツ速度 (px/秒)
    const spawnX = window.innerWidth;
    const travelTime = (spawnX - targetX) / noteSpeed; // 画面右端から判定枠までの移動時間

    let activeNotes = [];
    let chartIndex = 0;

    startBtn.addEventListener('click', () => {
      startOverlay.style.display = 'none';
      isPlaying = true;
      startTime = performance.now();
      requestAnimationFrame(gameLoop);
    });

    function gameLoop(now) {
      if (!isPlaying) return;

      const currentTime = (now - startTime) / 1000;

      // 譜面データからノーツを生成（判定位置にピッタリ届くタイミングで生成）
      while (chartIndex < chart.length && chart[chartIndex].time - travelTime <= currentTime) {
        const data = chart[chartIndex];
        createNote(data);
        chartIndex++;
      }

      // ノーツの移動と描画
      for (let i = activeNotes.length - 1; i >= 0; i--) {
        const note = activeNotes[i];
        const elapsedTime = currentTime - note.spawnTime;
        note.x = spawnX - (elapsedTime * noteSpeed);
        note.element.style.left = `${note.x}px`;

        // 見逃し（MISS）判定
        if (note.x < targetX - 70) {
          showJudgment('不可', '#ff5252');
          combo = 0;
          comboEl.textContent = combo;
          note.element.remove();
          activeNotes.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    function createNote(data) {
      const el = document.createElement('div');
      el.className = `note ${data.type}`;
      lane.appendChild(el);

      const currentTime = (performance.now() - startTime) / 1000;
      activeNotes.push({
        element: el,
        type: data.type,
        targetTime: data.time,
        spawnTime: currentTime,
        x: spawnX
      });
    }

    function hit(type) {
      if (!isPlaying || activeNotes.length === 0) return;

      const note = activeNotes[0];
      const noteCenterX = note.x + 40;
      const distance = Math.abs(noteCenterX - targetX);

      // 判定エリア内
      if (distance < 70) {
        if (note.type === type) {
          if (distance < 25) {
            showJudgment('良！', '#ffda79');
            score += 1000;
          } else {
            showJudgment('可', '#ffffff');
            score += 500;
          }
          combo++;
        } else {
          showJudgment('不可', '#ff5252');
          combo = 0;
        }
        scoreEl.textContent = score;
        comboEl.textContent = combo;

        note.element.remove();
        activeNotes.shift();
      }
    }

    function showJudgment(text, color) {
      judgmentEl.textContent = text;
      judgmentEl.style.color = color;
    }

    // タッチ＆キーボード操作
    document.getElementById('btn-don').addEventListener('touchstart', (e) => { e.preventDefault(); hit('don'); });
    document.getElementById('btn-ka').addEventListener('touchstart', (e) => { e.preventDefault(); hit('ka'); });
    document.getElementById('btn-ka2').addEventListener('touchstart', (e) => { e.preventDefault(); hit('ka'); });

    document.getElementById('btn-don').addEventListener('click', () => hit('don'));
    document.getElementById('btn-ka').addEventListener('click', () => hit('ka'));
    document.getElementById('btn-ka2').addEventListener('click', () => hit('ka'));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'j') hit('don');
      if (e.key === 'd' || e.key === 'k') hit('ka');
    });
  </script>
</body>
</html>
